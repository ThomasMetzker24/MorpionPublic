<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ec">
    <title>Morpion · À vous deux</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header>
        <p class="eyebrow">À VOUS DEUX</p>
        <h1>Morpion<span>.</span></h1>
        <p class="intro">Deux joueurs. Trois symboles alignés. À vous de jouer.</p>
      </header>

      <section class="play-area" aria-label="Partie de morpion">
        <div class="players" aria-label="Joueurs">
          <div class="player active" id="player-x"><span class="symbol x">X</span><span>Joueur X</span></div>
          <span class="versus" aria-hidden="true">/</span>
          <div class="player" id="player-o"><span class="symbol o">O</span><span>Joueur O</span></div>
        </div>
        <p id="status" role="status" aria-live="polite" aria-atomic="true">Au tour de X</p>
        <div class="board" role="group" aria-label="Grille de 3 lignes et 3 colonnes">
          <button class="cell" type="button" aria-label="Ligne 1, colonne 1 : vide" data-index="0"></button>
          <button class="cell" type="button" aria-label="Ligne 1, colonne 2 : vide" data-index="1"></button>
          <button class="cell" type="button" aria-label="Ligne 1, colonne 3 : vide" data-index="2"></button>
          <button class="cell" type="button" aria-label="Ligne 2, colonne 1 : vide" data-index="3"></button>
          <button class="cell" type="button" aria-label="Ligne 2, colonne 2 : vide" data-index="4"></button>
          <button class="cell" type="button" aria-label="Ligne 2, colonne 3 : vide" data-index="5"></button>
          <button class="cell" type="button" aria-label="Ligne 3, colonne 1 : vide" data-index="6"></button>
          <button class="cell" type="button" aria-label="Ligne 3, colonne 2 : vide" data-index="7"></button>
          <button class="cell" type="button" aria-label="Ligne 3, colonne 3 : vide" data-index="8"></button>
        </div>
        <button id="restart" type="button">Nouvelle partie <span aria-hidden="true">↗</span></button>
      </section>

      <footer>X commence. Alternez les coups sur le même écran.<br>Alignez trois symboles pour remporter la partie.</footer>
    </main>
  </body>
</html>
